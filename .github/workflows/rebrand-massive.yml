name: Rebrand site to MASSIVE

on:
  push:
    paths:
      - ".github/workflows/rebrand-massive.yml"

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MASSIVE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebrand text while preserving live infrastructure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          protected = {
              "https://next.vestmarkets.com/r/isgigaprop": "__KEEP_VEST_REF__",
              "https://gigaprop-profiles.johnhuska1260335.chatgpt.site/api": "__KEEP_PROFILE_API__",
              "gp@gigaprop.xyz": "__KEEP_OLD_EMAIL__",
              "https://raw.githubusercontent.com/deciphe/thepayoutlab/": "__KEEP_RAW_DATA__",
              "https://api.github.com/repos/deciphe/thepayoutlab/": "__KEEP_API_DATA__",
          }
          restore = {v:k for k,v in protected.items()}
          replacements = [
              ("GIGAPROP", "MASSIVE"),
              ("Gigaprop", "Massive"),
              ("gigaprop.xyz", "massiveprop.xyz"),
              ("gigaprop", "massiveprop"),
              ("gigaPnL", "MassivePnL"),
              ("GP.", "MASSIVE."),
          ]

          skip_parts = {".git", "node_modules", "dist"}
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if any(part in skip_parts for part in path.parts):
                  continue
              if path.parts[:2] == (".github","workflows"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              original = text
              for old, token in protected.items():
                  text = text.replace(old, token)
              for old, new in replacements:
                  text = text.replace(old, new)
              for token, old in restore.items():
                  text = text.replace(token, old)
              if text != original:
                  path.write_text(text, encoding="utf-8")

          Path("public/CNAME").write_text("massiveprop.xyz\n", encoding="utf-8")
          PY

      - name: Commit MASSIVE rebrand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand cloned site from GIGAPROP to MASSIVE" || exit 0
          git push origin HEAD:main
