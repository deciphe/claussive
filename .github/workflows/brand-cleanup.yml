name: Final MASSIVE brand cleanup

on:
  push:
    paths:
      - ".github/workflows/brand-cleanup.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace standalone GP wordmarks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          skip={'.git','node_modules','dist'}
          for p in root.rglob('*'):
              if not p.is_file() or any(x in skip for x in p.parts):
                  continue
              if p.parts[:2]==('.github','workflows'):
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              old=s
              s=re.sub(r'\bGP\b','MASSIVE',s)
              if s!=old:
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish MASSIVE visible brand cleanup" || exit 0
          git push origin HEAD:main
